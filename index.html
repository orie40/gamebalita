<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<!-- PWA: dipasang ke layar utama = fullscreen + landscape -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFC93C">
<title>Dunia Dino Kecil</title>
<style>
/* ===== Dasar: cegah zoom, scroll, seleksi ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;font-family:sans-serif}
body{background:linear-gradient(#bfe9ff,#e8fbd8);}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none}
svg{display:block;overflow:visible}
.btn{position:absolute;min-width:96px;min-height:96px;border:none;border-radius:50%;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.92)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
/* Tombol rumah orang tua */
#home{position:fixed;left:max(14px,env(safe-area-inset-left));top:14px;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.6);z-index:50;display:none;align-items:center;justify-content:center;touch-action:none}
#home svg.ring{position:absolute;inset:0}
#home circle.prog{stroke-dasharray:189;stroke-dashoffset:189;transition:none}
#home.hold circle.prog{stroke-dashoffset:0;transition:stroke-dashoffset 2s linear}
/* Grid umum */
.grid{position:absolute;inset:90px 24px 24px;display:grid;gap:18px;align-items:center;justify-items:center}
/* Layar sangat kecil: rapatkan jarak */
@media (max-height:380px),(max-width:600px){ .grid{gap:8px;inset:84px 10px 8px} }
/* Animasi */
@keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-22%) scale(1.05,.95)}60%{transform:translateY(0) scale(1.05,.95)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes dance{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-12deg) translateY(-10%)}50%{transform:rotate(0)}75%{transform:rotate(12deg) translateY(-10%)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6%)}75%{transform:translateX(6%)}}
@keyframes jiggle{0%,100%{transform:scale(1)}20%{transform:scale(1.08,.92)}40%{transform:scale(.94,1.06)}60%{transform:scale(1.05,.95)}80%{transform:scale(.97,1.03)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
@keyframes zzz{0%{opacity:0;transform:translate(0,0) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translate(40px,-120px) scale(1.4)}}
@keyframes burst{from{r:0}to{r:400}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.jump{animation:jump .6s ease 3}
.wiggle{animation:wiggle .5s ease 2}
.dance{animation:dance .8s ease infinite}
.shake{animation:shake .4s ease 2}
.jiggle{animation:jiggle .5s ease 2}
.popin{animation:pop .3s ease-out}
.breathe{animation:breathe 2.5s ease infinite}
.sparkle{position:fixed;pointer-events:none;z-index:40;animation:fly .9s ease-out forwards;font-size:0}
.zz{position:absolute;font:bold 48px sans-serif;color:#5c6bc0;animation:zzz 2s ease-out infinite;pointer-events:none}
.drag{position:absolute;touch-action:none;cursor:grab;transition:none}
.home-back{transition:left .5s ease,top .5s ease}
/* ===== Tambahan ramah anak ===== */
#stage{background:transparent}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.btn{border:5px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.12),0 14px 24px rgba(0,0,0,.08)}
/* Mata berkedip */
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
/* Melayang pelan (ikon menu, tombol) */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bob{animation:bob 2.6s ease-in-out infinite}
/* Awan berjalan */
@keyframes drift{from{transform:translateX(-40vw)}to{transform:translateX(140vw)}}
.cloud{position:absolute;left:0;animation:drift linear infinite;opacity:.85}
/* Lingkaran warna di setiap sentuhan */
@keyframes ripple{from{transform:scale(.1);opacity:.9}to{transform:scale(1);opacity:0}}
.ripple{position:fixed;width:120px;height:120px;border-radius:50%;border:8px solid;pointer-events:none;z-index:45;animation:ripple .5s ease-out forwards}
/* Konfeti jatuh saat perayaan */
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
.confetti{position:fixed;top:-30px;pointer-events:none;z-index:44;animation:fall 2.5s linear forwards}
/* Tangan penunjuk (petunjuk saat anak diam) */
@keyframes press{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
.hand{position:fixed;pointer-events:none;z-index:46;transition:left 1.1s ease-in-out,top 1.1s ease-in-out;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.hand.tap{animation:press .5s ease 3}
/* Kilau pada jawaban benar setelah beberapa kali mencoba */
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 #FFD54F)}50%{filter:drop-shadow(0 0 22px #FFC107)}}
.glow{animation:glow 1s ease infinite}
/* Huruf & angka besar membulat */
.big{font-family:'Arial Rounded MT Bold','Nunito','Comic Sans MS','Chalkboard SE',sans-serif;font-weight:900;line-height:1}
/* Layar "putar HP": hanya perangkat sentuh dalam posisi portrait */
#rotate{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:linear-gradient(#bfe9ff,#e8fbd8)}
@media (orientation:portrait) and (pointer:coarse){ #rotate{display:flex} }
@keyframes turn{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
#rotate .ph{animation:turn 2.4s ease-in-out infinite;transform-origin:50% 50%}
</style>
</head>
<body>
<div id="sky"></div>
<div id="stage"></div>
<!-- Ajakan memutar HP ke landscape (tanpa teks) -->
<div id="rotate"><svg width="220" height="220" viewBox="0 0 220 220">
  <g class="ph"><rect x="70" y="30" width="80" height="150" rx="16" fill="#fff" stroke="#5C6BC0" stroke-width="8"/><circle cx="110" cy="160" r="7" fill="#5C6BC0"/>
  <circle cx="98" cy="90" r="6" fill="#222"/><circle cx="122" cy="90" r="6" fill="#222"/><path d="M98 110 Q110 120 122 110" stroke="#222" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  <path d="M40 150 A80 80 0 0 1 60 50" stroke="#FF8A65" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M48 46 L62 48 L60 62" stroke="#FF8A65" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg></div>
<!-- Tombol rumah: tahan 2 detik -->
<div id="home">
  <svg class="ring" viewBox="0 0 64 64"><circle class="prog" cx="32" cy="32" r="30" fill="none" stroke="#ff7043" stroke-width="4" transform="rotate(-90 32 32)"/></svg>
  <svg width="34" height="34" viewBox="0 0 34 34"><path d="M4 17 L17 5 L30 17 V30 H4Z" fill="#ff8a65" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><rect x="13" y="20" width="8" height="10" rx="3" fill="#fff"/></svg>
</div>

<script>
'use strict';
/* =========================================================
   SISTEM SUARA (Web Audio + speechSynthesis id-ID)
   ========================================================= */
let AC = null;
function audioInit(){ if(!AC){ AC = new (window.AudioContext||window.webkitAudioContext)(); } if(AC.state==='suspended') AC.resume(); }
// Nada sederhana
function tone(f, dur=.15, type='sine', vol=.25, delay=0, f2){
  if(!AC) return;
  const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.05);
}
// Efek-efek bersama
const SFX={
  tap(){ tone(660,.12,'sine',.25,0,990); },
  pop(){ tone(500,.1,'sine',.3,0,1400); },
  boing(){ tone(220,.3,'triangle',.3,0,660); },
  chime(){ [784,988,1175,1568].forEach((f,i)=>tone(f,.25,'sine',.2,i*.08)); },
  chew(){ for(let i=0;i<4;i++) tone(180+i*20,.08,'triangle',.25,i*.18); },
  crack(){ tone(900,.08,'triangle',.18,0,400); },
  // Nada pentatonik naik bergantian: ketukan beruntun terdengar seperti lagu
  _n:0, note(){ tone([523,587,659,784,880,1046,880,784][this._n++%8],.18,'sine',.18); },
  giggle(){ [880,1046,880,1046,1318].forEach((f,i)=>tone(f,.09,'sine',.2,i*.09)); },
  clap(){ if(!AC) return; for(let k=0;k<6;k++){ const t=AC.currentTime+k*.13, b=AC.createBuffer(1,AC.sampleRate*.08,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); const s=AC.createBufferSource(), g=AC.createGain(); g.gain.value=.3; s.buffer=b; s.connect(g).connect(AC.destination); s.start(t);} },
  // Lagu ceria pendek
  song(){ BGM.duck(2000); [523,659,784,659,880,784,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.18,i*.2)); },
  // Lagu pengantar tidur (Nina Bobo sederhana)
  lullaby(){ BGM.duck(5500); [392,330,392,330,349,392,349,330,294,262].forEach((f,i)=>tone(f,.55,'sine',.15,i*.5)); }
};
/* ===== BGM: lagu ceria berulang, disintesis Web Audio =====
   Dijadwalkan per ketukan dengan lookahead agar tempo stabil. */
const BGM={
  gain:null, on:false, step:0, next:0, id:null, bpm:104,
  // Melodi pentatonik C (0 = diam), 32 ketukan setengah
  mel:[523,0,659,784, 659,0,523,587, 659,0,784,880, 784,0,659,0,
       587,0,659,523, 440,0,523,587, 659,0,587,523, 392,0,523,0],
  bass:[131,196,175,196, 131,196,147,196],
  start(){
    if(!AC||this.on) return; this.on=true;
    if(!this.gain){ this.gain=AC.createGain(); this.gain.gain.value=.07; this.gain.connect(AC.destination); }
    this.next=AC.currentTime+.1; this.step=0;
    this.id=setInterval(()=>this.tick(),50);
  },
  tick(){
    const dur=60/this.bpm/2;
    while(this.next<AC.currentTime+.2){
      const f=this.mel[this.step%this.mel.length], t=this.next;
      if(f) this.note(f,t,dur*.9,'triangle',1);
      if(this.step%4===0) this.note(this.bass[(this.step/4)%this.bass.length],t,dur*3.5,'sine',1.4);
      this.step++; this.next+=dur;
    }
  },
  note(f,t,d,type,v){
    const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(this.gain); o.start(t); o.stop(t+d+.05);
  },
  // Kecilkan sementara (saat lagu/efek panjang), lalu kembali
  duck(ms){ if(!this.gain) return; const g=this.gain.gain, t=AC.currentTime; g.cancelScheduledValues(t); g.setTargetAtTime(.012,t,.1); g.setTargetAtTime(.07,t+ms/1000,.4); }
};
// Hentikan suara saat tab/aplikasi disembunyikan
document.addEventListener('visibilitychange',()=>{ if(AC) document.hidden?AC.suspend():AC.resume(); });

// Ucapkan teks bahasa Indonesia (nada ceria)
function say(text, pitch=1.4, rate=.9){
  if(!('speechSynthesis' in window)) return;
  BGM.duck(1500); // BGM mengecil agar ucapan jelas
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='id-ID'; u.pitch=pitch; u.rate=rate;
  const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').startsWith('id')); if(v) u.voice=v;
  speechSynthesis.speak(u);
}

/* =========================================================
   DATA & GAMBAR KARAKTER (SVG, bulat, mata besar)
   ========================================================= */
// n = nama yang diucapkan (belajar kosakata), snd = tiruan suara
const AN={
  singa:{c:'#FFC04D',n:'singa',snd:'aum aum'}, gajah:{c:'#A9BCE0',n:'gajah',snd:'tuuuut'},
  bebek:{c:'#FFE44D',n:'bebek',snd:'kwek kwek'}, kucing:{c:'#FFB0D0',n:'kucing',snd:'meong'},
  sapi:{c:'#FFFFFF',n:'sapi',snd:'mooo'}, monyet:{c:'#C8935F',n:'monyet',snd:'uuk aak aak'},
  kelinci:{c:'#F1E4FA',n:'kelinci',snd:'ciit ciit'}, anjing:{c:'#E7B57E',n:'anjing',snd:'guk guk'},
  trex:{c:'#7ED957',n:'dino',snd:'raawr'}, tri:{c:'#FF9A70',n:'dino',snd:'grooo'},
  brachio:{c:'#6EC1FF',n:'dino',snd:'huuum'}, stego:{c:'#C58BE0',n:'dino',snd:'grrr grrr'}
};
const ANIMALS=['singa','gajah','bebek','kucing','sapi','monyet','kelinci','anjing'];
const DINOS=['trex','tri','brachio','stego'];
const ALL=ANIMALS.concat(DINOS);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
// Gelap sedikit untuk aksen
function dark(hex,p=.75){const n=parseInt(hex.slice(1),16);return `rgb(${(n>>16)*p|0},${(n>>8&255)*p|0},${(n&255)*p|0})`;}

/* animalSVG(jenis, ukuran, opsi) -> string SVG. opsi.mouth: 'smile'|'open'|'chew', opsi.sleep, opsi.shell */
function animalSVG(k,size=160,o={}){
  const c=AN[k].c, d=dark(c), isDino=DINOS.includes(k);
  let back='',front='',hy=40;
  if(k==='brachio') hy=26;
  switch(k){
    case 'singa': back=`<circle cx="50" cy="40" r="34" fill="#E8862E"/>`; break;
    case 'gajah': back=`<ellipse cx="20" cy="42" rx="17" ry="20" fill="${d}"/><ellipse cx="80" cy="42" rx="17" ry="20" fill="${d}"/>`;
      front=`<path d="M50 50 Q52 66 60 70" stroke="${c}" stroke-width="10" fill="none" stroke-linecap="round"/>`; break;
    case 'kucing': back=`<ellipse cx="32" cy="20" rx="9" ry="14" fill="${c}" transform="rotate(-20 32 20)"/><ellipse cx="68" cy="20" rx="9" ry="14" fill="${c}" transform="rotate(20 68 20)"/>`;
      front=`<path d="M22 50 H34 M66 50 H78" stroke="#555" stroke-width="2" stroke-linecap="round"/>`; break;
    case 'sapi': back=`<ellipse cx="22" cy="30" rx="12" ry="6" fill="#ffd1dc"/><ellipse cx="78" cy="30" rx="12" ry="6" fill="#ffd1dc"/><circle cx="38" cy="16" r="5" fill="#f5deb3"/><circle cx="62" cy="16" r="5" fill="#f5deb3"/>`;
      front=`<ellipse cx="62" cy="76" rx="9" ry="6" fill="#444"/><ellipse cx="36" cy="30" rx="7" ry="5" fill="#444"/>`; break;
    case 'monyet': back=`<circle cx="22" cy="42" r="11" fill="${c}"/><circle cx="78" cy="42" r="11" fill="${c}"/><circle cx="22" cy="42" r="6" fill="#F6D3A8"/><circle cx="78" cy="42" r="6" fill="#F6D3A8"/>`;
      front=``; break;
    case 'kelinci': back=`<ellipse cx="38" cy="10" rx="8" ry="20" fill="${c}"/><ellipse cx="62" cy="10" rx="8" ry="20" fill="${c}"/><ellipse cx="38" cy="10" rx="4" ry="14" fill="#ffc0d9"/><ellipse cx="62" cy="10" rx="4" ry="14" fill="#ffc0d9"/>`; break;
    case 'anjing': back=``; front=`<ellipse cx="24" cy="44" rx="9" ry="17" fill="${d}"/><ellipse cx="76" cy="44" rx="9" ry="17" fill="${d}"/>`; break;
    case 'trex': back=`<ellipse cx="84" cy="80" rx="18" ry="9" fill="${c}" transform="rotate(-20 84 80)"/>`; front=`<ellipse cx="34" cy="68" rx="5" ry="3" fill="${d}"/><ellipse cx="66" cy="68" rx="5" ry="3" fill="${d}"/>`; break;
    case 'tri': back=`<ellipse cx="84" cy="80" rx="16" ry="8" fill="${c}"/><path d="M18 40 A32 32 0 0 1 82 40Z" fill="${d}"/>`; front=`<circle cx="50" cy="22" r="4" fill="#fff5d6"/><circle cx="38" cy="25" r="4" fill="#fff5d6"/><circle cx="62" cy="25" r="4" fill="#fff5d6"/>`; break;
    case 'brachio': back=`<ellipse cx="86" cy="82" rx="16" ry="7" fill="${c}"/><rect x="40" y="30" width="20" height="40" rx="10" fill="${c}"/>`; break;
    case 'stego': back=`<ellipse cx="86" cy="80" rx="16" ry="8" fill="${c}"/>`+[26,40,56,72].map((x,i)=>`<circle cx="${x}" cy="${54-(i%2)*4}" r="8" fill="#FFB74D"/>`).join(''); break;
  }
  // Mulut
  let mouth;
  if(k==='bebek') mouth=o.mouth==='open'?`<ellipse cx="50" cy="${hy+14}" rx="13" ry="9" fill="#FF8F00"/><ellipse cx="50" cy="${hy+15}" rx="7" ry="5" fill="#b33"/>`:`<ellipse cx="50" cy="${hy+13}" rx="13" ry="6" fill="#FF8F00"/>`;
  else if(o.mouth==='open') mouth=`<ellipse cx="50" cy="${hy+14}" rx="9" ry="8" fill="#a33"/><ellipse cx="50" cy="${hy+18}" rx="5" ry="3" fill="#ff7b9c"/>`;
  else if(o.mouth==='chew') mouth=`<ellipse cx="50" cy="${hy+14}" rx="7" ry="3" fill="#a33"/>`;
  else mouth=`<path d="M40 ${hy+12} Q50 ${hy+22} 60 ${hy+12}" stroke="#663" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if(k==='monyet') mouth=`<ellipse cx="50" cy="${hy+10}" rx="16" ry="12" fill="#F6D3A8"/>`+mouth;
  // Mata (besar) atau tidur
  const eyes=o.sleep
    ?`<path d="M34 ${hy} Q40 ${hy+5} 46 ${hy} M54 ${hy} Q60 ${hy+5} 66 ${hy}" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>`
    :`<g class="eyes" style="animation-delay:-${(Math.random()*4.5).toFixed(2)}s"><circle cx="39" cy="${hy-2}" r="9" fill="#fff"/><circle cx="61" cy="${hy-2}" r="9" fill="#fff"/><circle cx="40" cy="${hy-1}" r="6" fill="#222"/><circle cx="62" cy="${hy-1}" r="6" fill="#222"/><circle cx="42.5" cy="${hy-3.5}" r="2.4" fill="#fff"/><circle cx="64.5" cy="${hy-3.5}" r="2.4" fill="#fff"/></g>`;
  const shell=o.shell?`<path d="M30 ${hy-18} Q50 ${hy-40} 70 ${hy-18} L64 ${hy-22} L58 ${hy-16} L50 ${hy-22} L42 ${hy-16} L36 ${hy-22}Z" fill="#FFF8E1" stroke="#E0C080" stroke-width="2" stroke-linejoin="round"/>`:'';
  const belly=`<ellipse class="belly" cx="50" cy="76" rx="${isDino?18:16}" ry="14" fill="rgba(255,255,255,.45)"/>`;
  return `<svg width="${size}" height="${size}" viewBox="-5 -15 110 115"><g class="body">${back}
    <ellipse cx="50" cy="74" rx="30" ry="24" fill="${c}" stroke="${d}" stroke-width="2"/>${belly}
    <ellipse cx="36" cy="95" rx="9" ry="5" fill="${d}"/><ellipse cx="64" cy="95" rx="9" ry="5" fill="${d}"/>
    <circle cx="50" cy="${hy}" r="26" fill="${c}" stroke="${d}" stroke-width="2"/>${front}
    <circle cx="30" cy="${hy+10}" r="5" fill="#ff9eb5" opacity=".6"/><circle cx="70" cy="${hy+10}" r="5" fill="#ff9eb5" opacity=".6"/>
    ${eyes}${mouth}${shell}</g></svg>`;
}
// Suara binatang: nada lucu + ucapan
// withName=true: ucapkan nama dulu ("sapi! mooo") untuk belajar kata
function animalSound(k,withName){ SFX.boing(); setTimeout(()=>say((withName?AN[k].n+'! ':'')+AN[k].snd,1.5),120); }

/* =========================================================
   UTILITAS BERSAMA: timer terkelola, efek bintang, drag
   ========================================================= */
let timers=[], rafs=[], cleanups=[], lastTouch=Date.now();
const T=(fn,ms)=>{const id=setTimeout(fn,ms);timers.push(id);return id;};
const I=(fn,ms)=>{const id=setInterval(fn,ms);timers.push(id);return id;};
function clearAll(){ timers.forEach(id=>{clearTimeout(id);clearInterval(id);}); rafs.forEach(cancelAnimationFrame); cleanups.forEach(f=>f()); timers=[];rafs=[];cleanups=[]; if(window.speechSynthesis) speechSynthesis.cancel(); }
const stage=document.getElementById('stage');
function el(tag,css,html){const e=document.createElement(tag);if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;return e;}
// Animasi ulang (restart class)
function anim(e,cls,ms){e.classList.remove('jump','wiggle','dance','shake','jiggle','popin');void e.offsetWidth;e.classList.add(cls);if(ms)T(()=>e.classList.remove(cls),ms);}
// Percikan bintang/konfeti di titik (x,y)
const COLORS=['#FF5E7E','#FFC93C','#4FC3F7','#7ED957','#B388FF','#FF8A65'];
function stars(x,y,n=12){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, r=80+Math.random()*120, s=el('div');
    s.className='sparkle'; s.style.cssText+=`left:${x-12}px;top:${y-12}px;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px`;

const ctr=e=>{const r=e.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];};

// Elemen yang bisa diseret. onDrop(cx,cy) -> true jika diterima; jika false kembali pelan
function draggable(e,onDrop){
  let sx,sy,ox,oy,id=null;
  e.classList.add('drag');
  e.addEventListener('pointerdown',ev=>{
    if(id!==null) return; id=ev.pointerId; e.setPointerCapture(id);
    e.classList.remove('home-back'); sx=ev.clientX; sy=ev.clientY; ox=e.offsetLeft; oy=e.offsetTop;
    e.dataset.hx=e.dataset.hx||ox; e.dataset.hy=e.dataset.hy||oy;
    e.style.zIndex=20; e.style.transform='scale(1.15)'; SFX.tap();
  });
  e.addEventListener('pointermove',ev=>{ if(ev.pointerId!==id) return; e.style.left=ox+ev.clientX-sx+'px'; e.style.top=oy+ev.clientY-sy+'px'; });
  const up=ev=>{
    if(ev.pointerId!==id) return; id=null; e.style.transform=''; e.style.zIndex=5;
    const [cx,cy]=ctr(e);
    if(!onDrop(cx,cy)){ e.classList.add('home-back'); e.style.left=e.dataset.hx+'px'; e.style.top=e.dataset.hy+'px'; }
  };
  e.addEventListener('pointerup',up); e.addEventListener('pointercancel',up);
}

  for(let i=0;i<6;i++){
    const b=el('div',`position:relative;width:${s}px;height:${s}px;cursor:pointer`);

      if(b.busy){ anim(a.firstChild,'jiggle'); SFX.giggle(); return; }

      a.innerHTML=animalSVG(k,s*.9); a.style.transform='scale(1)'; a.style.zIndex=2; bush.style.zIndex=1;

    };
    boxes.push(b); g.appendChild(b);

/* =========================================================
   2. TELUR DINO MENETAS
   ========================================================= */
function gameEgg(){
  scene('linear-gradient(#FFF8E1,#C5E1A5)');
  const s=Math.min(vmin()*.55,340);
  let taps=0;
  const wrap=el('div',`position:absolute;left:50%;top:42%;transform:translate(-50%,-50%)`);
  const eg=el('div','',eggSVG(s,0)); wrap.appendChild(eg); stage.appendChild(wrap);
  // Petunjuk: tangan mengetuk telur / menyuapi dino jika anak diam
  let hintFn=()=>hand(eg); idleHint(()=>hintFn(),5000);
  eg.onpointerdown=()=>{
    taps++; SFX.crack(); tone(400+taps*80,.1,'triangle',.2);
    eg.innerHTML=eggSVG(s,taps); anim(eg,'wiggle');
    if(taps>=5) T(hatch,300);
  };
  function hatch(){
    const k=rnd(DINOS), [x,y]=ctr(wrap); stars(x,y,20); SFX.chime(); SFX.clap(); confetti(30);
    wrap.innerHTML=''; const dino=el('div','position:relative',animalSVG(k,s,{shell:true})); wrap.appendChild(dino); anim(dino,'jump');
    T(()=>animalSound(k),400);
    let sleeping=false, zz=[];
    // Ketuk perut: tertawa & bergetar
    dino.onpointerdown=e=>{
      if(sleeping) wake();
      const r=dino.getBoundingClientRect(), yy=(e.clientY-r.top)/r.height;
      if(yy>.55){ SFX.giggle(); say('hihihi',1.8,1.2); anim(dino,'jiggle'); } else { SFX.tap(); anim(dino,'wiggle'); }
    };
    // Makanan: apel & daun diseret ke mulut
    const fs=Math.max(110,s*.32), foodEls=[];
    hintFn=()=>{ if(!sleeping) hand(rnd(foodEls),dino); };
    ['apel','daun'].forEach((f,i)=>{
      const fe=el('div',`left:${i?innerWidth-fs-30:30}px;top:${innerHeight-fs-30}px;width:${fs}px;height:${fs}px`,foodSVG(f,fs));
      stage.appendChild(fe); foodEls.push(fe);
      draggable(fe,(cx,cy)=>{
        const r=dino.getBoundingClientRect(), mouth=[r.left+r.width/2,r.top+r.height*.5];
        if(dist([cx,cy],mouth)<150){
          if(sleeping) wake();
          fe.style.transition='transform .3s'; fe.style.transform='scale(0)';
          dino.innerHTML=animalSVG(k,s,{shell:true,mouth:'chew'}); SFX.chew(); anim(dino,'jiggle');
          T(()=>{ dino.innerHTML=animalSVG(k,s,{shell:true}); stars(mouth[0],mouth[1],8); animalSound(k); },900);
          T(()=>{ fe.style.transition='none'; fe.style.left=fe.dataset.hx+'px'; fe.style.top=fe.dataset.hy+'px'; fe.style.transform='scale(0)'; requestAnimationFrame(()=>{fe.style.transition='transform .3s';fe.style.transform='';}); },1300);
          return true;
        } return false;
      });
    });
    // Bulan: tidur
    const moon=el('button',`right:30px;top:24px;width:110px;height:110px;background:#283593`,`<svg width="70" height="70" viewBox="0 0 100 100"><path d="M60 10 A40 40 0 1 0 90 66 A32 32 0 1 1 60 10Z" fill="#FFF59D"/></svg>`);
    moon.className='btn'; stage.appendChild(moon);
    moon.onpointerdown=()=>{
      if(sleeping) return; sleeping=true; dino.innerHTML=animalSVG(k,s,{shell:true,sleep:true}); dino.classList.add('breathe');
      stage.style.filter='brightness(.75)'; SFX.lullaby();
      for(let i=0;i<3;i++){ const z=el('div',`left:${55+i*8}%;top:${-5}%;animation-delay:${i*.6}s`,'z'); z.className='zz'; wrap.appendChild(z); zz.push(z); }
      T(()=>{ if(sleeping) wake(); },9000);
    };
    function wake(){ sleeping=false; stage.style.filter=''; dino.classList.remove('breathe'); zz.forEach(z=>z.remove()); zz=[]; dino.innerHTML=animalSVG(k,s,{shell:true}); }
    // Telur baru
    const again=el('button',`left:50%;bottom:24px;transform:translateX(-50%);width:110px;height:110px;background:#FFE082`,eggSVG(70,0));
    again.className='btn'; stage.appendChild(again);
    again.onclick=()=>{ SFX.pop(); stage.style.filter=''; gameEgg(); };
  }
  cleanups.push(()=>stage.style.filter='');
}

function gameSound(){
  scene('linear-gradient(#E1F5FE,#B3E5FC)');
  // Pilih tingkat: 2 titik / 3 titik
  const dots=n=>`<svg width="90" height="40" viewBox="0 0 90 40">${[...Array(n)].map((_,i)=>`<circle cx="${45+(i-(n-1)/2)*28}" cy="20" r="11" fill="#fff"/>`).join('')}</svg>`;

    b.className='btn popin'; b.onclick=()=>{ SFX.pop(); play(n); }; stage.appendChild(b);
  });
  function play(n){
    scene('linear-gradient(#E1F5FE,#B3E5FC)'); let q=0;
    const replay=el('button',`left:50%;top:24px;transform:translateX(-50%);width:110px;height:110px;background:#4FC3F7`,GAMES[2].ic().replace(/border-radius:28px;background:#81D4FA/,'background:none'));
    replay.className='btn'; stage.appendChild(replay);
    const row=el('div',`position:absolute;left:0;right:0;top:150px;bottom:24px;display:flex;flex-direction:${innerWidth>innerHeight?'row':'column'};justify-content:space-evenly;align-items:center`);
    stage.appendChild(row);
    let ans, miss=0;
    replay.onclick=()=>animalSound(ans);
    replay.classList.add('bob');
    // Jika diam, suara diulang dan tombol speaker diketuk tangan
    idleHint(()=>{ animalSound(ans); hand(replay); },7000);
    function ask(){
      row.innerHTML=''; miss=0; const opts=shuffle(ALL).slice(0,n); ans=rnd(opts);
      const s=Math.max(120,Math.min((innerWidth>innerHeight?innerWidth/(n+1):innerHeight/(n+1.6)),240));
      opts.forEach(k=>{
        const c=el('div',`cursor:pointer`,animalSVG(k,s)); c.classList.add('popin'); row.appendChild(c);
        c.onpointerdown=()=>{
          if(row.locked) return;

  // Lencana angka di pojok benda yang sudah dihitung
  function badge(it,num){
    const b=el('div',`position:absolute;right:-6px;top:-6px;width:56px;height:56px;border-radius:50%;background:${COLORS[num%6]};border:4px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;pointer-events:none`,num);
    b.className='big popin'; it.appendChild(b);
  }
  // Kartu angka: angka besar + titik sejumlah angka
  function numCard(n,s){
    const b=el('button',`position:relative;width:${s}px;height:${s*1.15}px;border-radius:28px;background:${COLORS[n%6]};flex-direction:column;gap:8px;padding:0`,
      `<div class="big" style="font-size:${s*.5}px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.15)">${n}</div><div style="display:flex;flex-wrap:wrap;justify-content:center;width:80%;gap:4px">${'<i style="width:13px;height:13px;border-radius:50%;background:#fff"></i>'.repeat(n)}</div>`);
    b.className='btn'; b.n=n; return b;
  }
  function next(){
    stage.innerHTML=''; round++;
    const max=round>6?10:5; let n; do n=1+Math.floor(Math.random()*max); while(n===last); last=n;
    (round%2?countRound:pickRound)(n,rnd(THINGS),max);
  }
  // Mode 1: anak mengetuk tiap benda, angka diucapkan
  function countRound(n,k){
    const counter=el('div',`position:absolute;left:50%;top:14px;transform:translateX(-50%);width:110px;height:110px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:72px;color:#FF7043;box-shadow:0 6px 0 rgba(0,0,0,.1)`);
    counter.className='big'; stage.appendChild(counter);
    const items=things(n,k,'left:12px;right:12px;top:136px;bottom:16px');
    let c=0;
    items.forEach(it=>it.onpointerdown=()=>{
      if(it.num){ anim(it.firstChild,'jiggle'); say(NUM[it.num]); return; }
      if(c>=n) return;
      it.num=++c; badge(it,c); anim(it.firstChild,'jump'); tone(SCALE[c-1],.2,'sine',.22); say(NUM[c],1.4,1);
      counter.textContent=c; anim(counter,'popin');
      if(c===n){
        T(()=>{ say('ada '+NUM[n]+'!',1.5); items.forEach(i=>i.firstChild.classList.add('dance')); confetti(35); SFX.chime(); stars(...ctr(counter),14); },900);
        T(next,3600);
      }
    });
    hint=()=>hand(items.find(i=>!i.num));
  }
  // Mode 2: benda dihitung bersama, lalu anak memilih kartu angka
  function pickRound(n,k,max){
    const land=innerWidth>innerHeight;
    const items=things(n,k,land?'left:24px;right:38%;top:100px;bottom:24px':`left:24px;right:24px;top:100px;bottom:${innerHeight*.36}px`,60); // benda hanya dilihat, boleh lebih kecil dari 96px
    items.forEach(it=>it.onpointerdown=()=>{ anim(it.firstChild,'jiggle'); SFX.giggle(); });
    items.forEach((it,i)=>T(()=>{ badge(it,i+1); anim(it.firstChild,'jump'); tone(SCALE[i],.2,'sine',.22); say(NUM[i+1],1.4,1); },600+i*800));
    hint=()=>{};
    T(()=>{
      const cnt=max>5?3:2, opts=[n];
      while(opts.length<cnt){ const o=1+Math.floor(Math.random()*max); if(!opts.includes(o)) opts.push(o); }
      const wrap=el('div',`position:absolute;${land?'right:24px;top:90px;bottom:24px;width:34%;flex-direction:column':'left:24px;right:24px;bottom:24px;height:33%'};display:flex;justify-content:space-evenly;align-items:center`);
      stage.appendChild(wrap);
      const cs=Math.max(96,land?Math.min(150,(innerHeight-130)/cnt/1.25):Math.min(150,(innerWidth-60)/cnt-16,innerHeight*.3/1.2));
      const q=()=>say('mana '+NUM[n]+'?',1.5);
      let miss=0, done=false;
      const cards=shuffle(opts).map(o=>{
        const b=numCard(o,cs); wrap.appendChild(b); anim(b,'popin');
        b.onpointerdown=()=>{
          if(done) return;
          if(o===n){
            done=true; b.classList.remove('glow'); anim(b,'dance'); SFX.clap(); SFX.chime(); confetti(40); stars(...ctr(b),16);
            say('pintar! '+NUM[n]+'!',1.6); items.forEach(i=>i.firstChild.classList.add('dance')); T(next,3200);
          } else {
            anim(b,'shake',900); SFX.tap(); T(q,300);
            if(++miss>=2) cards.find(c=>c.n===n).classList.add('glow'); // bantuan
          }
        };
        return b;
      });
      q(); hint=()=>{ q(); hand(cards.find(c=>c.n===n)); };
    },600+n*800+200);
  }
  next();
}

/* =========================================================
   10. AYO MEMBACA (kenal huruf + gambar)
   Kenalan 3 huruf, lalu kuis "mana huruf ...?"
   ========================================================= */
function gameRead(){
  scene('linear-gradient(#EDE7F6,#E1F5FE)');
  // [huruf, cara baca, gambar, kata]
  const ABC=[['A','a','anjing','anjing'],['B','be','bebek','bebek'],['D','de','trex','dino'],['G','ge','gajah','gajah'],['K','ka','kucing','kucing'],['M','em','monyet','monyet'],['P','pe','pisang','pisang'],['S','es','sapi','sapi'],['W','we','wortel','wortel']];
  let idx=0, sinceQuiz=0, quizzes=0, seen=[], hint=()=>{};
  idleHint(()=>hint(),6000);
  // Kartu huruf besar "Aa"
  function letterEl(it,s){
    const c=['#FF5E7E','#4FC3F7','#7ED957','#B388FF','#FF8A65','#26A69A'][ABC.indexOf(it)%6];
    const e=el('div',`position:relative;width:${s}px;height:${s}px;border-radius:${s*.2}px;background:#fff;border:6px solid ${c};color:${c};display:flex;align-items:center;justify-content:center;font-size:${s*.52}px;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.1)`,
      `${it[0]}<span style="font-size:.62em;margin-left:5%">${it[0].toLowerCase()}</span>`);
    e.className='big'; return e;
  }
  const picSound=it=>AN[it[2]]?animalSound(it[2],true):(SFX.boing(),say(it[3],1.5));
  // Mode kenal huruf: ketuk huruf -> diucapkan + gambar muncul
  function learn(){
    stage.innerHTML='';
    const it=ABC[idx]; idx=(idx+1)%ABC.length; if(!seen.includes(it)) seen.push(it);
    const land=innerWidth>innerHeight, s=Math.max(150,Math.min(land?innerWidth*.34:innerWidth*.62, land?innerHeight*.6:innerHeight*.32, 300));
    const wrap=el('div',`position:absolute;inset:90px 24px 140px;display:flex;flex-direction:${land?'row':'column'};align-items:center;justify-content:space-evenly`);
    const le=letterEl(it,s), pic=el('div',`transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1);cursor:pointer`,picSVG(it[2],s*.9));
    wrap.append(le,pic); stage.appendChild(wrap); anim(le,'popin');
    const nextB=el('button',`right:24px;bottom:24px;width:110px;height:110px;background:#7ED957;display:none`,ARROW);
    nextB.className='btn bob'; stage.appendChild(nextB);
    let tapped=false;
    T(()=>say(it[1],1.4),400);
    le.onpointerdown=()=>{
      tapped=true; anim(le,'jiggle'); SFX.chime(); stars(...ctr(le),12);
      pic.style.transform='scale(1)'; anim(pic.firstChild,'jump');
      say(`${it[1]}! ${it[1]}! ${it[3]}!`,1.4,.85); nextB.style.display='flex';
    };
    pic.onpointerdown=()=>{ if(tapped){ anim(pic.firstChild,'jump'); picSound(it); } };
    nextB.onpointerdown=()=>{ SFX.pop(); if(++sinceQuiz>=3){ sinceQuiz=0; quiz(); } else learn(); };
    hint=()=>hand(tapped?nextB:le);
  }
  // Kuis: dengar huruf, ketuk kartu yang benar
  function quiz(){
    stage.innerHTML=''; quizzes++;
    const cnt=quizzes>2?3:2, target=rnd(seen.slice(-3)), opts=[target];
    while(opts.length<cnt){ const o=rnd(ABC); if(!opts.includes(o)) opts.push(o); }
    const land=innerWidth>innerHeight;
    const s=Math.max(120,Math.min(land?(innerWidth-80)/cnt-30:innerWidth*.5, land?innerHeight*.5:(innerHeight-200)/cnt-30, 240));
    const q=()=>say(`mana ${target[1]}? ${target[1]}, ${target[3]}`,1.5,.9);
    const sp=el('button',`left:calc(50% - 55px);top:14px;width:110px;height:110px;background:#4FC3F7`,SPK);
    sp.className='btn bob'; sp.onpointerdown=q; stage.appendChild(sp);
    const row=el('div',`position:absolute;inset:140px 24px 24px;display:flex;flex-direction:${land?'row':'column'};align-items:center;justify-content:space-evenly`);
    stage.appendChild(row);
    let miss=0, done=false;
    const cards=shuffle(opts).map(it=>{
      const c=letterEl(it,s); c.it=it; row.appendChild(c); anim(c,'popin');
      c.onpointerdown=()=>{
        if(done) return;
        if(it===target){
          done=true; c.classList.remove('glow'); anim(c,'dance'); SFX.clap(); SFX.chime(); confetti(40); stars(...ctr(c),16);
          // Gambar kata muncul di atas kartu
          const p=el('div',`position:absolute;left:50%;top:-35%;transform:translateX(-50%);pointer-events:none`,picSVG(it[2],s*.6));
          c.appendChild(p); anim(p.firstChild,'jump');
          say(`pintar! ${it[1]}, ${it[3]}!`,1.6); T(learn,3400);
        } else {
          anim(c,'shake',900); T(q,300);
          if(++miss>=2) cards.find(x=>x.it===target).classList.add('glow'); // bantuan
        }
      };
      return c;
    });
    T(q,400);
    hint=()=>{ q(); hand(miss?cards.find(x=>x.it===target):sp); };
  }
  learn();
}

showStart();
</script>
